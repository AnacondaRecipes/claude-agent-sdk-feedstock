{% set name = "claude-agent-sdk" %}
{% set version = "0.2.168" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/claude_agent_sdk-{{ version }}.tar.gz
  sha256: 80388054a09c137d76fc29caa6e46bc90d2ae2ef09fac5ee1c38fc36d2762fda

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - hatchling
    - pip
    - python
  run:
    - anyio >=4.0.0
    - jsonschema >=4.20.0
    - mcp >=1.23.0,<3.0.0
    - python
    - sniffio >=1.0.0
    - typing_extensions >=4.0.0  # [py<311]
  run_constrained:
    # [otel] extra; import is guarded by try/except ImportError.
    - opentelemetry-api >=1.20.0

test:
  source_files:
    - tests
  requires:
    - pip
    - pytest
    - trio
  commands:
    - pip check
    # test_changelog.py needs CHANGELOG.md (not in sdist). test_build_wheel.py, test_download_cli.py
    # and test_update_cli_version.py test upstream's CLI-bundling release scripts, not the SDK.
    - pytest tests -v --ignore=tests/test_changelog.py --ignore=tests/test_build_wheel.py --ignore=tests/test_download_cli.py --ignore=tests/test_update_cli_version.py
  imports:
    - claude_agent_sdk

about:
  home: https://github.com/anthropics/claude-agent-sdk-python
  license_file: LICENSE
  license: MIT
  license_family: MIT
  summary: Python SDK for Claude Agent.
  description: Python SDK for Claude Agent.
  dev_url: https://github.com/anthropics/claude-agent-sdk-python
  doc_url: https://code.claude.com/docs/en/agent-sdk/python

extra:
  recipe-maintainers:
    - viridianmelody
